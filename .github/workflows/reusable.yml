name: Reusable CI

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 18
          - 20

    runs-on: ${{ matrix.os }}

    name: Test on ${{ matrix.os }} with Node ${{ matrix.node-version }}

    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Check API key
        shell: bash
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API key is available"
          else
            echo "API key is missing"
            exit 1
          fi

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            server.js
            package.json
            package-lock.json
            views/
