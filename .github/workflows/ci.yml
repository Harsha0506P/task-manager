name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 18
          - 20

    runs-on: ${{ matrix.os }}

    name: Test on ${{ matrix.os }} with Node ${{ matrix.node-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

